<title>غذاؤك دواؤك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: short hero, product cards on the left, order panel sticky on the right; stacks on phones with a bottom order bar. Cookies-and-milk palette. Arabic (RTL) by default, English toggle. */
:root {
  --bg: #EAF1F6;        /* milk */
  --surface: #FFFFFF;
  --plate: #DCE7EF;
  --ink: #2E1C12;       /* cocoa */
  --muted: #6E5D52;
  --line: #D2DEE7;
  --accent: #B85E17;    /* caramel */
  --accent-ink: #FFFFFF;
  --leaf: #2C7348;      /* nutrition note */
  --leaf-soft: #DDEFE3;
  --wa: #1A8F4C;
  --wa-ink: #FFFFFF;
  --danger: #B3261E;
  --danger-ink: #FFFFFF;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", "Helvetica Neue", system-ui, sans-serif;
  --naskh: "Amiri", "Geeza Pro", "Times New Roman", serif;
}
html[lang="ar"] {
  --display: "Readex Pro", "Geeza Pro", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", "Geeza Pro", system-ui, sans-serif;
}
/* Always light, even when the phone is in dark mode. "only" also stops browsers from auto-darkening the page. */
:root { color-scheme: light only; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
html[lang="ar"] body * { letter-spacing: 0 !important; } /* spacing breaks Arabic letter joining */
body.has-bar { padding-bottom: 88px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
.brand svg { width: 34px; height: 34px; }
#shopName { font-family: "Readex Pro", "Geeza Pro", system-ui, sans-serif; font-weight: 700; letter-spacing: 0; }
.top-right { display: flex; align-items: center; gap: 10px; }
.top-note { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
@media (max-width: 520px) { .top-note { display: none; } }
.nav-link { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--leaf-soft); color: var(--leaf); font-weight: 600; font-size: 0.9rem; text-decoration: none; white-space: nowrap; }
.nav-link:hover { background: var(--leaf); color: var(--surface); }
.nav-link svg { width: 16px; height: 16px; flex: none; }
.lang { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
.lang:hover { background: var(--ink); color: var(--surface); }
.lang[lang="ar"] { font-family: "IBM Plex Sans Arabic", "Geeza Pro", system-ui, sans-serif; }
.lang[lang="en"] { font-family: "Figtree", system-ui, sans-serif; }

/* Hero */
.hero { padding-block: 20px 36px; }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.1rem, 5.4vw, 3.6rem); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 14px; max-width: 14ch; text-wrap: balance; }
html[lang="ar"] .hero h1 { font-weight: 700; line-height: 1.3; max-width: 16ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { margin: 0; max-width: 52ch; color: var(--muted); font-size: 1.08rem; }
.hero p a { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.products { scroll-margin-top: 20px; }
.hero-links { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 20px; }
.watch-link { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 600; text-decoration: none; }
.watch-link:hover { text-decoration: underline; text-underline-offset: 4px; }
.watch-link svg { width: 26px; height: 26px; flex: none; }
.seal { display: inline-flex; align-items: center; gap: 10px;padding-block: 6px; padding-inline: 6px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 0.95rem; }
.seal .leaf { width: 32px; height: 32px; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; flex: none; }
.seal .leaf svg { width: 18px; height: 18px; }
.seal strong { color: var(--leaf); font-weight: 700; }

/* Hadith (always Arabic) */
.hadith-band { padding-block: 0 36px; }
.hadith { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 28px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: var(--naskh); letter-spacing: 0; }
.hadith-intro { margin: 0; color: var(--muted); font-size: 1.1rem; line-height: 1.9; max-width: 60ch; }
.hadith-text { margin: 0; color: var(--ink); font-size: clamp(1.7rem, 4.2vw, 2.5rem); font-weight: 700; line-height: 1.8; text-wrap: balance; }
.hadith figcaption { display: flex; align-items: center; gap: 12px; color: var(--leaf); font-size: 1.05rem; font-weight: 700; }
.hadith figcaption::before, .hadith figcaption::after { content: ""; width: 36px; height: 1px; background: var(--leaf); opacity: 0.5; }

/* Layout */
.layout { display: grid; grid-template-columns: 1fr; gap: 28px; padding-block: 0 64px; }
.products { display: grid; grid-template-columns: 1fr; gap: 24px; min-width: 0; }
@media (min-width: 640px) { .products { grid-template-columns: 1fr 1fr; } }
@media (min-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
  .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); }
}

/* Product cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.art { aspect-ratio: 4 / 3; max-width: 100%; background: var(--plate); position: relative; overflow: hidden; }
.art > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.art .tag { inset: auto; inset-block-start: 14px; inset-inline-start: 14px; width: auto; height: auto; background: var(--surface); color: var(--ink); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; }
.pop { animation: pop 0.45s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes pop { from { transform: scale(0.86) rotate(-12deg); opacity: 0.3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

.card-body { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.card h3 { font-family: var(--display); font-weight: 800; font-size: 1.55rem; letter-spacing: -0.015em; margin: 0; }
html[lang="ar"] .card h3 { font-weight: 700; }
.price { font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.desc { margin: 0; color: var(--muted); }
.sup { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 0.85rem; font-weight: 600; color: var(--leaf); }
.sup svg { width: 16px; height: 16px; flex: none; }

.flavors { display: flex; flex-wrap: wrap; gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
.flavors legend { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; }
.flavor { position: relative; }
.flavor input { position: absolute; opacity: 0; pointer-events: none; }
.flavor label { display: inline-flex; align-items: center; gap: 8px; padding-block: 6px; padding-inline: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); cursor: pointer; font-weight: 600; font-size: 0.92rem; transition: background 0.15s, border-color 0.15s, color 0.15s; }
.flavor label:hover { border-color: var(--ink); }
.flavor input:checked + label { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.flavor input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.14); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.75rem; font-weight: 700; display: inline-grid; place-items: center; }

.actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.btn-add { width: 100%; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.1s; }
.btn-add:active { transform: scale(0.98); }
.stepper { display: flex; align-items: center; justify-content: space-between; border: 1.5px solid var(--ink); border-radius: 14px; padding: 4px; }
.stepper button { width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; font-size: 1.4rem; line-height: 1; cursor: pointer; }
.stepper button:hover { background: var(--plate); }
.stepper .qty { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Order panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.015em; margin: 0; }
html[lang="ar"] .panel h2 { font-weight: 700; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.clear-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; }
.clear-btn:hover { border-color: var(--danger); color: var(--danger); }
.clear-btn svg { width: 18px; height: 18px; }
dialog.confirm { border: 0; border-radius: 20px; padding: 24px; width: min(360px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
dialog.confirm::backdrop { background: rgba(20, 12, 8, 0.55); }
dialog.confirm h3 { margin: 0 0 8px; font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
dialog.confirm p { margin: 0 0 20px; color: var(--muted); }
.confirm-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.btn-ghost { padding: 11px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; font-weight: 600; cursor: pointer; }
.btn-danger { padding: 11px 16px; border-radius: 12px; border: 0; background: var(--danger); color: var(--danger-ink); font-weight: 700; cursor: pointer; }
.empty { margin: 0; color: var(--muted); padding: 18px; border: 1.5px dashed var(--line); border-radius: 16px; text-align: center; }
.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.line-name { font-weight: 600; }
.line-name small { display: block; font-weight: 500; color: var(--muted); font-size: 0.85rem; }
.line-total { font-weight: 700; font-variant-numeric: tabular-nums; text-align: end; }
.mini { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 10px; justify-self: start; }
.mini button { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
.mini button:hover { background: var(--plate); }
.mini span { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.line-unit { font-size: 0.85rem; color: var(--muted); text-align: end; font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; border-top: 1.5px dashed var(--line); }
.total span { font-weight: 600; }
.total strong { font-family: var(--display); font-weight: 800; font-size: 1.7rem; font-variant-numeric: tabular-nums; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 0.85rem; font-weight: 600; }
.field input, .field textarea { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--ink); outline: none; }

.wa-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 14px; background: var(--wa); color: var(--wa-ink); font-weight: 700; font-size: 1.05rem; text-decoration: none; }
.wa-btn svg { width: 22px; height: 22px; }
.wa-btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
.fine { margin: 0; font-size: 0.85rem; color: var(--muted); }
.fine b { color: var(--ink); user-select: all; font-variant-numeric: tabular-nums; unicode-bidi: isolate; }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-size: 0.9rem; font-weight: 600; }
.preview { white-space: pre-wrap; font-size: 0.85rem; background: var(--bg); border-radius: 12px; padding: 12px; margin: 10px 0 8px; user-select: all; overflow-wrap: anywhere; }
.copy { border: 1.5px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

/* Phone order bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--ink); color: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-sum { font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; }
.bar-sum strong { font-family: var(--display); font-size: 1.2rem; }
.bar-actions { display: flex; align-items: center; gap: 10px; }
.bar .clear-btn { color: var(--surface); border-color: color-mix(in srgb, var(--surface) 35%, transparent); }
.bar .clear-btn:hover { color: var(--danger); border-color: var(--danger); }
.bar a { background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; padding: 12px 18px; border-radius: 12px; }
@media (min-width: 960px) { .bar { display: none; } body.has-bar { padding-bottom: 0; } }

/* Video */
.video-band { padding-block: 0 48px; }
.video-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px; display: grid; grid-template-columns: 1fr; gap: 24px; align-items: center; scroll-margin-top: 20px; }
@media (min-width: 720px) { .video-card { grid-template-columns: minmax(0, 1fr) 300px; padding: 32px 40px; } }
.video-text { min-width: 0; }
.eyebrow { margin: 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.video-text h2 { margin: 4px 0 8px; font-family: var(--display); font-weight: 800; font-size: clamp(1.5rem, 3.5vw, 2rem); text-wrap: balance; }
html[lang="ar"] .video-text h2 { font-weight: 700; }
.video-text p { margin: 0 0 18px; color: var(--muted); max-width: 46ch; }
.order-now { display: inline-flex; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
.phone { justify-self: center; width: min(300px, 100%); max-width: 100%; aspect-ratio: 9 / 16; border-radius: 30px; border: 6px solid var(--ink); overflow: hidden; background: #2A1B12; }
.phone video { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Nutritionist contact */
.expert-band { padding-block: 0 48px; }
.expert { background: var(--leaf-soft); border-radius: 24px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 28px; scroll-margin-top: 20px; }
.expert-id { display: flex; align-items: center; gap: 16px; min-width: 0; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--leaf); color: var(--surface); display: grid; place-items: center; flex: none; font-family: var(--display); font-weight: 700; font-size: 1.6rem; }
.expert-eyebrow { margin: 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--leaf); }
.expert h2 { margin: 2px 0 4px; font-family: var(--display); font-weight: 700; font-size: 1.45rem; }
.expert p.expert-text { margin: 0; color: var(--muted); }
.social { display: flex; flex-wrap: wrap; gap: 10px; }
.social a { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); text-decoration: none; font-weight: 600; transition: border-color 0.15s, color 0.15s; }
.social a:hover { border-color: var(--leaf); color: var(--leaf); }
.social svg { width: 20px; height: 20px; flex: none; }
a.seal { color: inherit; text-decoration: none; }
a.seal:hover { border-color: var(--leaf); }

footer { padding-block: 0 40px; color: var(--muted); font-size: 0.85rem; }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><span id="brandMark"></span><span id="shopName" lang="ar">غذاؤك دواؤك</span></div>
    <div class="top-right">
      <span class="top-note" data-t="topNote"></span>
      <a class="nav-link" href="#nutritionist" data-scroll><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg><span data-t="contact"></span></a>
      <button class="lang" id="langBtn" type="button"></button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 data-t-html="heroTitle"></h1>
    <p data-t-html="heroText"></p>
    <div class="hero-links">
      <a class="seal" href="#nutritionist" id="sealLink"><span class="leaf" data-leaf></span><span data-t-html="sealText"></span></a>
      <a class="watch-link" href="#video" data-scroll><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M10 8.2v7.6l6-3.8z" fill="var(--surface)"/></svg><span data-t="watch"></span></a>
    </div>
  </div>
</section>

<section class="hadith-band" lang="ar" dir="rtl">
  <div class="wrap">
    <figure class="hadith">
      <p class="hadith-intro">عن أم المؤمنين عائشة رضي الله عنها أن رسول الله صلى الله عليه وسلم قال:</p>
      <blockquote class="hadith-text">«التَّلبينةُ مُجِمَّةٌ لفُؤادِ المَريضِ، تُذهِبُ بَعضَ الحُزنِ»</blockquote>
      <figcaption>(رواه البخاري ومسلم)</figcaption>

  </div>
</section>

<main class="wrap layout">
  <div class="products" id="products">
    <article class="card" id="cupCard">
      <div class="art" id="cupArt"></div>
      <div class="card-body">
        <div class="title-row"><h3 id="cupName"></h3><span class="price" id="cupPrice"></span></div>
        <p class="desc" id="cupDesc"></p>
        <p class="sup"><span data-leaf></span><span data-t="supShort"></span></p>
        <div class="actions" id="cupActions"></div>
      </div>
    </article>

    <article class="card" id="bigCard">
      <div class="art" id="bigArt"></div>
      <div class="card-body">
        <div class="title-row"><h3 id="bigName"></h3><span class="price" id="bigPrice"></span></div>
        <p class="desc" data-t="bigDesc"></p>
        <p class="sup"><span data-leaf></span><span data-t="supShort"></span></p>
        <fieldset class="flavors" id="flavors"><legend data-t="flavor"></legend></fieldset>
        <div class="actions" id="bigActions"></div>
      </div>

  </div>

  <aside class="panel" id="order" aria-labelledby="orderTitle">
    <div class="panel-head">
      <h2 id="orderTitle" data-t="yourOrder"></h2>
      <button class="clear-btn" id="clearBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="orderLines"></div>
    <div class="total"><span data-t="total"></span><strong id="total"></strong></div>
    <div class="field">
      <label for="custName" data-t="nameLabel"></label>
      <input id="custName" type="text" autocomplete="name" data-t-ph="namePh">
    </div>
    <div class="field">
      <label for="custNote" data-t="noteLabel"></label>
      <textarea id="custNote" rows="2" data-t-ph="notePh"></textarea>
    </div>
    <a class="wa-btn" id="sendBtn" href="#" target="_blank" rel="noopener" aria-disabled="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
      <span data-t="send"></span>
    </a>

function rng(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function blob(cx, cy, r, wobble, n, rand) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, rr = r * (1 + (rand() - 0.5) * wobble);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  let m = mid(pts[n - 1], pts[0]), d = `M${m[0].toFixed(1)},${m[1].toFixed(1)}`;
  for (let i = 0; i < n; i++) { const p = pts[i], q = mid(p, pts[(i + 1) % n]); d += `Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${q[0].toFixed(1)},${q[1].toFixed(1)}`; }
  return d + "Z";
}
function cookie(cx, cy, r, art, seed) {
  const rand = rng(seed);
  let s = `<ellipse cx="${cx}" cy="${cy + r * 0.12}" rx="${r * 1.02}" ry="${r * 0.98}" fill="rgba(40,20,10,.18)"/>`;
  s += `<path d="${blob(cx, cy, r, 0.08, 22, rand)}" fill="${art.edge}"/>`;
  s += `<path d="${blob(cx, cy - r * 0.03, r * 0.9, 0.07, 22, rand)}" fill="${art.dough}"/>`;
  for (let i = 0; i < 4; i++) { // baked cracks
    const a = rand() * Math.PI * 2, d0 = r * (0.2 + rand() * 0.4), x = cx + Math.cos(a) * d0, y = cy + Math.sin(a) * d0, len = r * 0.22;
    s += `<path d="M${x},${y} q${len * 0.5},${-len * 0.3} ${len},${len * 0.1}" stroke="${art.edge}" stroke-width="${r * 0.025}" fill="none" stroke-linecap="round" opacity=".55"/>`;
  }
  const chips = Math.max(5, Math.round(r / 7));
  for (let i = 0; i < chips; i++) {
    const a = rand() * Math.PI * 2, d0 = Math.sqrt(rand()) * r * 0.72, cr = r * (0.07 + rand() * 0.05);
    const fill = art.chip2 && i % 2 ? art.chip2 : art.chip;
    s += `<path d="${blob(cx + Math.cos(a) * d0, cy + Math.sin(a) * d0, cr, 0.45, 7, rand)}" fill="${fill}"/>`;
  }
  return s;
}

  const a = e.target.closest("a[data-scroll]");
  if (!a) return;
  e.preventDefault();
  document.querySelector(a.getAttribute("href")).scrollIntoView({ behavior: "smooth", block: "start" });
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const key = b.dataset.key;
  setQty(key, getQty(key) + (b.dataset.act === "inc" ? 1 : -1));
});
$("flavors").addEventListener("change", (e) => {
  if (e.target.name !== "flavor") return;
  selected = e.target.value;
  renderBigArt();
  $("bigActions").innerHTML = stepper("big:" + selected, L(flavorById(selected).name));
});
$("langBtn").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("cookie-lang", lang); } catch (e) {}
  applyLang();
});
["custName", "custNote"].forEach((id) => $(id).addEventListener("input", renderOrder));
function clearCart() {
  cart.cup = 0;
  for (const id in cart.big) cart.big[id] = 0;
  save(); render();
}
// After WhatsApp opens with the order, empty the order. Delayed so the link opens with the full message first.
$("sendBtn").addEventListener("click", () => {
  if (!lines().length) return;
  setTimeout(() => { $("custNote").value = ""; clearCart(); }, 400);
});
const dlg = $("clearDialog");
$("clearBtn").addEventListener("click", () => dlg.showModal());
$("barClear").addEventListener("click", () => dlg.showModal());
$("clearNo").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
$("clearYes").addEventListener("click", () => { clearCart(); dlg.close(); });
$("social").addEventListener("click", (e) => { if (e.target.closest("[data-empty]")) e.preventDefault(); });
$("sealLink").addEventListener("click", (e) => { e.preventDefault(); $("nutritionist").scrollIntoView({ behavior: "smooth", block: "center" }); });
$("barLink").addEventListener("click", (e) => { e.preventDefault(); $("order").scrollIntoView({ behavior: "smooth", block: "start" }); });
$("copyBtn").addEventListener("click", () => {
  const done = () => { $("copyBtn").textContent = t("copied"); setTimeout(() => ($("copyBtn").textContent = t("copy")), 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("preview")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copyBtn").textContent = t("selected"); };
  try { navigator.clipboard.writeText(messageText()).then(done, fallback); } catch (err) { fallback(); }
});

applyLang();
</script>
